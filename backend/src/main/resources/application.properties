server.port=${PORT:8080}
ocm.api.key=${OCM_API_KEY}
groq.api.key=${GROQ_API_KEY}
chargeprice.api.key=${CHARGEPRICE_API_KEY:}
apininjas.api.key=${APININJAS_API_KEY:}
nobil.api.key=${NOBIL_API_KEY:}

# PostgreSQL on Render; H2 in-memory fallback for local dev (no DB_URL needed)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000
